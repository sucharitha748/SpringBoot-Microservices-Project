spring.application.name=ORDER-SERVICE

server.port=8082

user.service.url=http://localhost:8081

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL Database - Day 11
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Root@123
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Resilience4j Circuit Breaker - Payment Service
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2

# Day 8 - User Service Circuit Breaker
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=2

# Day 8 - User Service Retry
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=500ms

# Day 9 - User Service Bulkhead
resilience4j.bulkhead.instances.userService.max-concurrent-calls=2
resilience4j.bulkhead.instances.userService.max-wait-duration=0

# Day 11 - Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Day 11 - Correlation ID Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n